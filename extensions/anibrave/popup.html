<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>AniBrave</title></head><body>
<header><img src="icons/32.png" alt=""><h1>AniBrave</h1></header>
<main><p id="host">Connecting…</p>
<div class="speed-control" aria-label="Playback speed"><button id="decrease" aria-label="Decrease playback speed">−</button><output id="rate" aria-live="polite">1×</output><button id="increase" aria-label="Increase playback speed">+</button></div>
<label class="view-row" for="mode">View<select id="mode"><option value="desktop">Desktop</option><option value="mobile">Mobile</option><option value="identity">Mobile identity · desktop layout</option></select></label>
<details id="memory"><summary>Episode memory</summary><div class="memory-content"><button id="toggle" class="text">+ Remember episode</button><form id="manual" hidden><label>Anime title<input id="title" maxlength="200" required placeholder="High School DxD"></label><div class="row"><label>Season<input id="season" type="number" min="1" max="100" value="1" required></label><label>Episode<input id="episode" type="number" min="1" max="10000" required></label><button type="submit">Save</button></div></form><div id="history"></div></div></details>
<p id="status" role="status" aria-live="polite"></p></main><script src="popup.js" type="module"></script></body></html>
